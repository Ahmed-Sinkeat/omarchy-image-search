name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned so a runner image upgrade cannot turn CI red on its own.
      - name: Install shellcheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version
        env:
          SHELLCHECK_VERSION: 0.11.0

      - name: Lint
        run: shellcheck omarchy-capture-image-search install.sh test-image-search.sh

      - name: Parse
        run: |
          for script in omarchy-capture-image-search install.sh test-image-search.sh; do
            bash -n "$script"
          done

      - name: Test
        run: ./test-image-search.sh
